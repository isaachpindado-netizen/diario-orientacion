<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="description" content="Diario de orientación: previa, resultados, errores, mapas y temporada. Funciona sin conexión.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario O">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{-webkit-text-size-adjust:100%;color-scheme:light}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Diario de orientación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 760px) under a sticky top bar; a bottom tab bar on phones moves into the top bar on wide screens. The map annotator opens full-screen over everything. */
:root{
  --ground:#F6F4EE; --surface:#FFFFFF; --sunk:#EDEAE2; --ink:#1C1C1A; --ink-2:#3D3B37; --muted:#5C5A55;
  --line:#E2DED4; --line-2:#F0EDE6; --field:#FFFFFF; --field-line:#CFCAC0;
  --accent:#A21C6F; --accent-hover:#8A165E; --accent-ink:#FFFFFF; --accent-soft:#F3E3EC; --accent-text:#7E1556;
  --orange:#C2410C; --orange-mid:#E0803F; --amber:#E8B04B; --orange-soft:#FBEADF; --orange-text:#8A2F0A;
  --blue:#1D5FBF; --blue-soft:#E6EEF9; --blue-text:#174B96;
  --green:#2F7D32; --green-soft:#E3F0E4; --green-text:#1F5E22;
  --stone:#9C978C; --invert:#1C1C1A; --invert-ink:#FFFFFF; --invert-muted:#CFCAC0;
  --scrim:rgba(28,28,26,.45); --shadow:0 1px 2px rgba(28,28,26,.06),0 10px 30px rgba(28,28,26,.12);
  --m-hice:#E4572E; --m-pense:#1D5FBF; --m-rodear:#FFB000; --m-nota:#1C1C1A; --m-halo:#FFFFFF; --m-ground:#E4E0D6;
  --f-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-card:16px; --r-ctl:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141412; --surface:#1E1D1A; --sunk:#2A2925; --ink:#EEECE6; --ink-2:#D3D0C8; --muted:#A6A298;
    --line:#34322D; --line-2:#292824; --field:#191816; --field-line:#4A473F;
    --accent:#E070AE; --accent-hover:#EA8CC0; --accent-ink:#1F0A16; --accent-soft:#3B1A2D; --accent-text:#F4B3D6;
    --orange:#F0804F; --orange-mid:#E99A5F; --amber:#E8B04B; --orange-soft:#3A2217; --orange-text:#F6B996;
    --blue:#77A6EE; --blue-soft:#1A2639; --blue-text:#AFC9F3;
    --green:#74C278; --green-soft:#1B2E1C; --green-text:#AADCAC;
    --stone:#7F7B71; --invert:#EEECE6; --invert-ink:#141412; --invert-muted:#5C5A55;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    --m-ground:#2A2925; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#141412; --surface:#1E1D1A; --sunk:#2A2925; --ink:#EEECE6; --ink-2:#D3D0C8; --muted:#A6A298;
  --line:#34322D; --line-2:#292824; --field:#191816; --field-line:#4A473F;
  --accent:#E070AE; --accent-hover:#EA8CC0; --accent-ink:#1F0A16; --accent-soft:#3B1A2D; --accent-text:#F4B3D6;
  --orange:#F0804F; --orange-mid:#E99A5F; --amber:#E8B04B; --orange-soft:#3A2217; --orange-text:#F6B996;
  --blue:#77A6EE; --blue-soft:#1A2639; --blue-text:#AFC9F3;
  --green:#74C278; --green-soft:#1B2E1C; --green-text:#AADCAC;
  --stone:#7F7B71; --invert:#EEECE6; --invert-ink:#141412; --invert-muted:#5C5A55;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  --m-ground:#2A2925; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ground)}
body.no-scroll{overflow:hidden}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar + tabs */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:16px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1}
.brand svg{flex:none}
.tabs-top{display:none;margin-left:auto;gap:4px}
.tabs-top a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.tabs-top a:hover{color:var(--ink)}
.tabs-top a[aria-current="page"]{background:var(--invert);color:var(--invert-ink)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
.tabbar a[aria-current="page"]{color:var(--accent-text)}
.banner-wrap{max-width:760px;margin:12px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{padding:10px 14px;border-radius:12px;background:var(--orange-soft);color:var(--orange-text);font-size:14px;font-weight:600}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){.tabbar{display:none}.tabs-top{display:flex}.wrap{padding-block:28px 64px}}

/* type */
.h-display{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(36px,9vw,48px);line-height:.98;letter-spacing:.005em;text-wrap:balance}
.h-2{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.02;text-wrap:balance;overflow-wrap:anywhere}
.h-3{margin:0;font-size:16px;font-weight:700;line-height:1.3;text-wrap:balance}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-text)}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{font-size:13px;color:var(--muted)}
.num{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.err-msg{color:var(--orange-text);font-size:14px;font-weight:600}
.err-msg:empty{display:none}

/* blocks */
.page-h{display:flex;flex-direction:column;padding-top:4px}
.page-h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--orange-soft);color:var(--orange-text);font-size:12px;font-weight:700;margin-left:6px;vertical-align:2px}
.cta{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-t{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 240px}
.empty{border:1.5px dashed var(--field-line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--ink-2)}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.row-gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--field-line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{background:transparent}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.btn-danger{background:var(--orange);border-color:var(--orange);color:var(--accent-ink)}
.btn-danger-ghost{background:transparent;border-color:transparent;color:var(--orange-text);padding-left:6px;padding-right:6px}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;padding:6px 2px;color:var(--accent-text);font-weight:600;cursor:pointer;font-size:14px;text-decoration:none}
.link.danger{color:var(--orange-text)}
.back{background:none;border:0;padding:8px 0;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:4px}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--sunk);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.btn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}

/* chips & pills */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--invert);border-color:var(--invert);color:var(--invert-ink)}
.chip .n{font-family:var(--f-display);font-size:16px;color:var(--muted)}
.chip[aria-pressed="true"] .n,.chip[aria-pressed="true"] .cnt{color:var(--invert-muted)}
.chip .cnt{font-size:12px;color:var(--muted);font-weight:600}
.chip-sm{min-height:34px;padding:0 12px;font-size:13px}
.chip-desc{font-size:13px;color:var(--muted);min-height:1em}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap}
.p-win{background:var(--green-soft);color:var(--green-text)}
.p-clean{background:var(--orange-soft);color:var(--orange-text)}
.p-errors{background:var(--accent-soft);color:var(--accent-text)}
.p-pace{background:var(--blue-soft);color:var(--blue-text)}
.p-prox{background:var(--blue-soft);color:var(--blue-text)}
.p-pend{background:var(--orange-soft);color:var(--orange-text)}
.p-ok{background:var(--sunk);color:var(--ink-2)}
.flag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--orange-text);background:var(--orange-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* forms */
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;margin:0;padding:0}
.field > label,.field > legend,.lbl{font-size:14px;font-weight:700;padding:0}
.field > legend{margin-bottom:6px}
input[type=text],input:not([type]),input[type=time],input[type=date],input[type=url],input[type=number],select,textarea{width:100%;min-height:46px;border:1px solid var(--field-line);border-radius:10px;background:var(--field);color:var(--ink);padding:10px 12px;font-size:16px}
textarea{resize:vertical;line-height:1.45;display:block}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input[aria-invalid="true"]{border-color:var(--orange)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rate-b{min-height:44px;border-radius:10px;border:1px solid var(--field-line);background:var(--surface);font-family:var(--f-display);font-size:21px;font-weight:700;cursor:pointer;color:var(--ink)}
.rate-b[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.switch-row .sw-t{display:flex;flex-direction:column;font-size:15px}
.switch-row .sw-t span{font-size:13px;color:var(--muted)}
.switch-row input{width:24px;height:24px;accent-color:var(--accent);flex:none}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.race-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line-2);background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.race-row:first-child{border-top:0}
.race-row:hover{background:var(--line-2)}
.date-blk{display:flex;flex-direction:column;align-items:center;line-height:1}
.date-blk b{font-family:var(--f-display);font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
.date-blk span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.rr-main{min-width:0}
.rr-name{display:block;font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.rr-meta{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.rr-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.rr-loss{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rr-loss-l{font-size:11px;color:var(--muted)}
.month-h{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.ctl{flex:none;width:36px;height:36px;border:2.5px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent-text);font-variant-numeric:tabular-nums;line-height:1}
.err-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line-2);background:transparent;text-align:left;color:var(--ink);cursor:pointer}
.err-row:first-child{border-top:0}
.err-row:hover{background:var(--line-2)}
.er-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.er-top{font-weight:700;font-size:14px}
.er-why{font-size:13px;color:var(--ink-2)}
.er-paso{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.er-rule{font-size:13px;font-weight:600;color:var(--accent-text);margin-top:2px}
.er-s{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.sz-big{color:var(--orange)}.sz-mid{color:var(--orange-mid)}.sz-small{color:var(--muted)}
.focos{margin:0;padding:0;list-style:none;counter-reset:f;display:flex;flex-direction:column;gap:12px}
.focos li{counter-increment:f;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;font-size:15px;line-height:1.4}
.focos li::before{content:counter(f);width:30px;height:30px;border:2.5px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--accent-text);font-size:16px;line-height:1}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rules li{padding:10px 0;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:2px}
.rules li:first-child{border-top:0;padding-top:0}
.rules b{font-weight:600;font-size:15px}
.rules span{font-size:12.5px;color:var(--muted)}

/* race detail */
.det-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:-8px}
.det-h{display:flex;flex-direction:column;gap:10px}
.det-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;padding:0 4px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg .c{font-size:12px;margin-left:3px;font-weight:600}
.horario{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.h-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line-2);font-size:14px}
.h-row:first-child{border-top:0}
.h-t{font-family:var(--f-display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;line-height:1}
.h-off{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.h-row.go{background:var(--accent-soft)}
.h-row.go .h-t{color:var(--accent-text)}
.check{display:flex;flex-direction:column}
.check h4{margin:12px 0 2px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.check h4:first-child{margin-top:0}
.ck{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 2px;font-size:15px;cursor:pointer;border-top:1px solid var(--line-2)}
.ck input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.ck input:checked + span,.ck input:checked + label{color:var(--muted);text-decoration:line-through}
.ck label{flex:1;min-width:0;cursor:pointer;min-height:36px;display:flex;align-items:center;overflow-wrap:anywhere}
.verdict .v-top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.v-big{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:.85;font-variant-numeric:tabular-nums}
.v-cmp{display:grid;grid-template-columns:62px minmax(0,1fr) 54px;gap:8px 10px;align-items:center;font-size:13px;color:var(--ink-2)}
.v-cmp b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.bar-t{height:12px;border-radius:6px;background:var(--line-2);overflow:hidden;display:flex}
.bar-t.thin{height:9px}
.bar-t > span{display:block;height:100%}
.c-salida{background:var(--blue)}.c-tramo{background:var(--stone)}.c-entrada{background:var(--orange)}
.c-mental{background:var(--accent)}.c-otro{background:var(--stone)}
.b-big{background:var(--orange)}.b-mid{background:var(--orange-mid)}.b-small{background:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.brows{display:flex;flex-direction:column;gap:12px}
.brow{display:flex;flex-direction:column;gap:5px}
.brow-h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.brow-h b{font-weight:600}
.brow-h span{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.leg-row{display:grid;grid-template-columns:36px minmax(0,1fr) 52px auto;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line-2)}
.leg-row:first-child{border-top:0}
.leg-s{font-family:var(--f-display);font-size:19px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.leg-b{min-height:34px;padding:0 12px;border-radius:17px;border:0;font-size:13px;font-weight:600;cursor:pointer;background:var(--accent-soft);color:var(--accent-text)}
.leg-b.done{background:var(--green-soft);color:var(--green-text)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-top:1px solid var(--line-2);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;border-top:0;background:var(--line-2)}
th:first-child,td:first-child{text-align:left}
tr.lost td{background:var(--orange-soft);color:var(--orange-text);font-weight:600}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent-text);padding:6px 0}
details[open] summary{margin-bottom:8px}
.maps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.map-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.map-card:hover{border-color:var(--ink-2)}
.mc-w{display:flex;flex-direction:column;gap:4px}.mc-cover{font-size:12px;font-weight:700;color:var(--accent-text);padding:2px 4px}.mc-set{font-size:12.5px;align-self:flex-start;padding:2px 4px}
.maps-grid.gal{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
#mg-q{width:100%;box-sizing:border-box;min-height:48px;border:1px solid var(--field-line);border-radius:12px;padding:0 14px;background:var(--field);font:inherit;font-size:16px;color:var(--ink)}
.cover{position:relative;border-radius:18px;overflow:hidden;background:var(--sunk);min-height:200px;display:flex;align-items:flex-end}
.cover > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.cover-in{position:relative;width:100%;padding:56px 16px 14px;background:linear-gradient(to top,rgba(20,20,18,.88),rgba(20,20,18,.55) 60%,rgba(20,20,18,0));color:#fff;display:flex;flex-direction:column;gap:6px}
.cover-in .eyebrow{color:#F6DCEA;margin:0}.cover-in h1{color:#fff;margin:0}.cover-in .det-meta,.cover-in .det-meta span{color:#fff}.cover-l{margin:0;font-size:14px;color:#EDEAE2}
.cover-open{position:absolute;top:10px;right:10px;min-height:36px;padding:0 12px;border-radius:18px;border:0;background:rgba(255,255,255,.92);color:#1C1C1A;font:600 13px var(--f-body);cursor:pointer}
.race-row.has-thumb{grid-template-columns:46px 52px minmax(0,1fr) auto}
.rr-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.ph-row{display:flex;flex-wrap:wrap;gap:8px}.ph{position:relative}.ph-b{display:block;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;background:var(--sunk)}
.ph-b img{display:block;width:76px;height:76px;object-fit:cover}
.ph-x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;line-height:1;cursor:pointer}
.ph-add{display:flex;align-items:center;justify-content:center;width:78px;height:78px;border:1.5px dashed var(--field-line);border-radius:10px;color:var(--accent-text);font-weight:700;font-size:13px;cursor:pointer}
.er-ph{display:flex;gap:6px;margin-top:6px;align-items:center}.er-ph img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--sunk)}.er-ph span{font-size:12px;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px max(16px,env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.9);font-size:22px;cursor:pointer}
.map-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--m-ground);max-width:100%}
img.broken{visibility:hidden}
.mc-b{padding:8px 10px;display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:1px}
.mc-b b{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:12px;background:var(--orange-soft);color:var(--orange-text);font-size:14px;font-weight:600}

/* season */
.filters{display:flex;flex-direction:column;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi-l{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi-v{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.kpi-s{font-size:12.5px;color:var(--muted)}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:f}
.ins li{counter-increment:f;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.ins li::before{content:counter(f);width:30px;height:30px;border:2.5px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--accent-text);font-size:16px;line-height:1}
.ins b{display:block;font-size:15px}
.ins span{display:block;font-size:14px;color:var(--ink-2)}
.ins em{display:block;font-style:normal;font-size:14px;font-weight:600;color:var(--accent-text);margin-top:2px}
.pr-row{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line-2)}
.pr-row:first-of-type{border-top:0;padding-top:0}
.pr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pr-n{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}
.pr-n span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.pr-bars{display:grid;grid-template-columns:56px minmax(0,1fr) 52px;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.pr-bars b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.chart-wrap{width:100%;overflow:hidden}
.chart-wrap svg{display:block;width:100%;height:auto}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-t{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--accent);fill-opacity:.12;stroke:none}
.ch-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.ch-dot.end{fill:var(--accent)}
.ch-end{fill:var(--accent-text);font-family:var(--f-display);font-weight:700;font-size:18px}
.ask-row{display:flex;gap:8px;align-items:flex-end}
.ask-row textarea{flex:1;min-width:0}
.ask-out{white-space:pre-wrap;font-size:15px;line-height:1.55;background:var(--line-2);border-radius:12px;padding:12px 14px;overflow-wrap:anywhere}
.ask-out:empty{display:none}
.stats-list{list-style:none;margin:0;padding:0;display:flex;gap:18px;flex-wrap:wrap}
.stats-list li{font-size:14px;color:var(--ink-2)}
.stats-list b{font-size:26px;margin-right:4px}
.warm-row{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;gap:8px;align-items:center}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--ground);width:100%;max-width:640px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;border-radius:20px 20px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);overscroll-behavior:contain}
@media (min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:20px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px}
.sp{flex:1}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;z-index:70;background:var(--invert);color:var(--invert-ink);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;width:max-content;max-width:calc(100vw - 32px);text-align:center;transition:opacity .2s,transform .2s;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:32px}}

/* map annotator */
.mapa{position:fixed;inset:0;z-index:45;background:var(--ground);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mp-top{display:flex;align-items:center;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:4px;border-bottom:1px solid var(--line);min-height:52px}
.mp-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.mp-title b{font-family:var(--f-display);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-title span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-vp{position:relative;overflow:hidden;background:var(--m-ground);touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;min-height:0}
.mp-vp.mover{cursor:grab}
.mp-stage{position:absolute;left:0;top:0;transform-origin:0 0}
.mp-stage img{display:block;max-width:none;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}
.mp-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mp-svg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mp-svg .halo{stroke:var(--m-halo);stroke-opacity:.85;stroke-width:var(--hw,8px)}
.mp-svg .st{stroke-width:var(--sw,4px)}
.mp-svg .st-hice{stroke:var(--m-hice)}
.mp-svg .st-pense{stroke:var(--m-pense);stroke-dasharray:var(--dash,9px 7px)}
.mp-svg .st-rodear{stroke:var(--m-rodear)}
.pin-s{transform:scale(var(--pin,1))}
.pin circle{fill:var(--m-nota);stroke:var(--m-halo);stroke-width:2.5px}
.pin text{fill:var(--m-halo);font-family:var(--f-body);font-size:14px;font-weight:700}
.pin.sel circle{fill:var(--m-hice)}
.mp-msg{position:absolute;inset:auto 12px 12px 12px;padding:10px 12px;border-radius:10px;background:var(--surface);color:var(--ink);font-size:14px;box-shadow:var(--shadow)}
.mp-zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px}
.mp-zoom button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center}
.mp-tools{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:8px 2px;border-top:1px solid var(--line)}
.tool{min-height:58px;border-radius:10px;border:1.5px solid transparent;background:transparent;color:var(--ink-2);font-size:11.5px;font-weight:600;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:4px 2px;text-align:center}
.tool svg{display:block}
.tool[aria-pressed="true"]{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.mp-help{font-size:12.5px;color:var(--muted);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:2px 6px;text-align:center}
.mp-notes{overflow:auto;max-height:32vh;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.note-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.note-it{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink);font-size:14px;cursor:pointer}
.note-it.on{border-color:var(--accent)}
.note-it .nt{min-width:0;overflow-wrap:anywhere}
.note-it .nt i{color:var(--muted)}
.note-it .ne{display:block;font-size:12px;font-weight:600;color:var(--accent-text)}
.pin-badge{flex:none;width:24px;height:24px;border-radius:50%;background:var(--invert);color:var(--invert-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.note-ed{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:10px}
.note-ed-h{display:flex;align-items:center;gap:8px}
.note-ed-h b{flex:1}
.mp-meta{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--line-2)}
@media (min-width:900px){
  .mapa{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto auto minmax(0,1fr)}
  .mp-top{grid-column:1 / -1}
  .mp-vp{grid-column:1;grid-row:2 / 5}
  .mp-tools{grid-column:2;grid-row:2;grid-template-columns:repeat(3,minmax(0,1fr));border-top:0}
  .mp-help{grid-column:2;grid-row:3}
  .mp-notes{grid-column:2;grid-row:4;max-height:none}
}
/* v2: previa, resumen, editors */
.ante-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg2{display:inline-grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg2 button{min-height:38px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.rw-row{display:grid;grid-template-columns:42px 52px minmax(0,1fr) auto 32px;gap:4px;align-items:center}
.rw-row .icon-btn{width:32px;min-width:32px;height:40px}.mv{display:flex;gap:0}.mv .icon-btn[disabled]{opacity:.3;cursor:default}.rw-row span.h-t{font-size:14px;letter-spacing:-.01em;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.rw-row input[type=number]{padding-inline:6px;text-align:center;-moz-appearance:textfield;appearance:textfield}.rw-row input[type=number]::-webkit-inner-spin-button,.rw-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.rw-row .h-t{font-size:20px}
.rw-head{display:grid;grid-template-columns:42px 52px minmax(0,1fr) 64px 32px;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.rs{gap:14px}
.rs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:1px dashed var(--field-line)}
.rs-hora{font-family:var(--f-display);font-weight:700;font-size:54px;line-height:.85;font-variant-numeric:tabular-nums;color:var(--accent-text)}
.rs-when{text-align:right;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rs-foco{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;text-wrap:balance}
.rs-foco::before{content:"Foco";display:block;font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-text);margin-bottom:4px}
.rs-blk{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px dashed var(--field-line)}
.rs-top + .rs-blk{border-top:0;padding-top:0}
.rs-blk h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rs-txt{font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.rs-ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:15px}
.meters{display:flex;gap:18px;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.dots{display:inline-flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.on{background:var(--accent)}
.rs-miss{font-size:13px;color:var(--muted)}
.chk-add{display:flex;gap:8px;margin-top:8px}
.chk-add input{flex:1;min-width:0}
.ck .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;width:36px;height:36px}
.ck-tag{font-size:11px;color:var(--muted);font-weight:600;margin-left:6px}
.pv-row{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pv-row.off{opacity:.55}
.pv-top{display:flex;align-items:center;gap:4px}
.pv-type{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex:1}
.mini{min-width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--ground);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;padding:0 8px}
.mini.danger{color:var(--orange-text)}
.tx-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto 40px;gap:6px;align-items:center}
.tx-row.nodesc{grid-template-columns:minmax(0,1fr) 40px}
.tx-row label{font-size:12px;display:flex;align-items:center;gap:4px;color:var(--muted)}
.tx-row label input{width:20px;height:20px;accent-color:var(--accent)}
@media (max-width:520px){.tx-row{grid-template-columns:minmax(0,1fr) 40px}.tx-row > input:first-child{grid-column:1;grid-row:1}.tx-row > .icon-btn{grid-column:2;grid-row:1}.tx-row .tx-d{grid-column:1 / -1;grid-row:2}.tx-row .tx-m{grid-column:1 / -1;grid-row:3}.tx-row > span:empty{display:none}}
.add-opt{display:flex;gap:8px}
.add-opt input{flex:1;min-width:0}
.file-btn{position:relative;overflow:hidden}
.file-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.drop{border:1.5px dashed var(--field-line);border-radius:var(--r-card);padding:14px;display:flex;flex-direction:column;gap:10px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.paste-box textarea{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.c-f0{background:var(--blue)}.c-f1{background:var(--stone)}.c-f2{background:var(--orange)}.c-f3{background:var(--green)}.c-f4{background:var(--amber)}.c-f5{background:var(--accent)}

<script>
/* Local platform: keeps every record and map image on this device (IndexedDB).
   Exposes the same small API the app used inside Claude (db, assets, downloads),
   so the app logic stays the same. Nothing leaves the device unless you export it. */
(function () {
  'use strict';
  const DB_NAME = 'diario-orientacion', DB_VER = 1;
  const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
  const isObj = o => !!o && typeof o === 'object' && !Array.isArray(o);
  function deepMerge(t, s) { for (const k of Object.keys(s)) { if (isObj(s[k]) && isObj(t[k])) deepMerge(t[k], s[k]); else t[k] = clone(s[k]); } return t; }
  function err(code, message) { const e = new Error(message || code); e.code = code; return e; }

  let idb = null;
  const mem = {};           // col -> id -> data
  const subs = {};          // col -> [cb]
  const urls = new Map();   // asset id -> object URL
  const meta = new Map();   // asset id -> {size, type, creado}

  function openIdb() {
    return new Promise((res, rej) => {
      let rq;
      try { rq = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
      rq.onupgradeneeded = () => {
        const d = rq.result;
        if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs');
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }
  function tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = idb.transaction(store, mode); const s = t.objectStore(store);
      let out; try { out = fn(s); } catch (e) { rej(e); return; }
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error && t.error.name === 'QuotaExceededError' ? err('quota_exceeded') : t.error);
      t.onabort = () => rej(t.error && t.error.name === 'QuotaExceededError' ? err('quota_exceeded') : (t.error || err('aborted')));
    });
  }
  function getAll(store) {
    return new Promise((res, rej) => {
      const t = idb.transaction(store, 'readonly'); const s = t.objectStore(store);
      const keys = s.getAllKeys(), vals = s.getAll();
      t.oncomplete = () => res(keys.result.map((k, i) => [k, vals.result[i]]));
      t.onerror = () => rej(t.error);
    });
  }

  let ready = null;
  function init() {
    if (ready) return ready;
    ready = (async () => {
      idb = await openIdb();
      for (const [k, v] of await getAll('docs')) {
        const i = k.indexOf('/'); const col = k.slice(0, i), id = k.slice(i + 1);
        (mem[col] = mem[col] || {})[id] = v;
      }
      for (const [id, v] of await getAll('blobs')) {
        if (v && v.blob) { urls.set(id, URL.createObjectURL(v.blob)); meta.set(id, { size: v.blob.size, type: v.type || v.blob.type, creado: v.creado }); }
      }
      try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { /* optional */ }
      return true;
    })();
    return ready;
  }

  function list(col) { const m = mem[col] || {}; return Object.keys(m).map(id => ({ id, exists: true, data: () => clone(m[id]) })); }
  function notify(col) { setTimeout(() => (subs[col] || []).forEach(cb => { try { cb({ docs: list(col) }); } catch (e) { console.error(e); } }), 0); }
  async function put(col, id, data) { await tx('docs', 'readwrite', s => s.put(data, col + '/' + id)); (mem[col] = mem[col] || {})[id] = data; notify(col); }

  const db = {
    collection(col) {
      return {
        onSnapshot(cb) { (subs[col] = subs[col] || []).push(cb); setTimeout(() => cb({ docs: list(col) }), 0); return () => { subs[col] = (subs[col] || []).filter(x => x !== cb); }; }
      };
    },
    doc(path) {
      const i = path.indexOf('/'); const col = path.slice(0, i), id = path.slice(i + 1);
      return {
        async set(data) { await put(col, id, clone(data)); },
        async update(patch) { const cur = clone((mem[col] || {})[id] || {}); await put(col, id, deepMerge(cur, patch)); },
        async delete() { await tx('docs', 'readwrite', s => s.delete(col + '/' + id)); if (mem[col]) delete mem[col][id]; notify(col); }
      };
    }
  };

  function newId() { const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); }
  async function putBlob(id, blob, type) {
    const rec = { blob, type: type || blob.type, creado: new Date().toISOString() };
    await tx('blobs', 'readwrite', s => s.put(rec, id));
    if (urls.has(id)) URL.revokeObjectURL(urls.get(id));
    urls.set(id, URL.createObjectURL(blob)); meta.set(id, { size: blob.size, type: rec.type, creado: rec.creado });
    return { id, url: urls.get(id), sizeBytes: blob.size, contentType: rec.type };
  }
  async function getBlob(id) {
    return new Promise((res, rej) => { const t = idb.transaction('blobs', 'readonly'); const r = t.objectStore('blobs').get(id); t.oncomplete = () => res(r.result ? r.result.blob : null); t.onerror = () => rej(t.error); });
  }
  const assets = {
    async upload(blob, opts) { await init(); return putBlob(newId(), blob, opts && opts.type); },
    async list() {
      await init();
      let maxBytes = null; try { const e = await navigator.storage.estimate(); maxBytes = e.quota || null; } catch (e) { /* unknown */ }
      const all = Array.from(meta.entries()).map(([id, m]) => ({ id, url: urls.get(id), sizeBytes: m.size, contentType: m.type, createdAt: m.creado }));
      return { assets: all, usage: { bytes: all.reduce((t, a) => t + (a.sizeBytes || 0), 0), maxBytes } };
    },
    async delete(id) { await init(); await tx('blobs', 'readwrite', s => s.delete(id)); if (urls.has(id)) URL.revokeObjectURL(urls.get(id)); urls.delete(id); meta.delete(id); }
  };

  const MIME = { csv: 'text/csv;charset=utf-8', json: 'application/json', png: 'image/png', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
  const downloads = {
    async save({ filename, data }) {
      const ext = String(filename).split('.').pop().toLowerCase();
      const blob = data instanceof Blob ? data : new Blob([data], { type: MIME[ext] || 'application/octet-stream' });
      const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (touch && navigator.canShare) {
        try {
          const file = new File([blob], filename, { type: blob.type || MIME[ext] || 'application/octet-stream' });
          if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; }
        } catch (e) {
          if (e && e.name === 'AbortError') throw err('declined');
          /* fall through to a normal download */
        }
      }
      const a = document.createElement('a'); const url = URL.createObjectURL(blob);
      a.href = url; a.download = filename; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
  };

  window.__ODB = {
    init, url: id => urls.get(id) || '', getBlob, putBlob,
    hasBlob: id => urls.has(id),
    async clearAll() { await init(); await tx('docs', 'readwrite', s => s.clear()); await tx('blobs', 'readwrite', s => s.clear()); }
  };
  window.claude = {
    async use(name) {
      try { await init(); } catch (e) { console.warn('IndexedDB', e); return null; }
      if (name === 'db') return db;
      if (name === 'assets') return assets;
      if (name === 'downloads') return downloads;
      return null;
    }
  };
})();
</script>

function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o); }

function defPrevia() {

    const club = txt(owner, 'Organisation', 'Name') || txt(owner, 'Organisation', 'ShortName') || txt(owner, 'Club', 'ShortName') || txt(owner, 'Club', 'Name') || team || '';
    let estado = txt(res, 'Status'); if (!estado) { const cs = kid(res, 'CompetitorStatus'); estado = cs ? (cs.getAttribute('value') || '') : ''; }

    const splits = kids(res, 'SplitTime').filter(st => (st.getAttribute('status') || '') !== 'Additional').map(st => ({ code: txt(st, 'ControlCode'), t: parseIofTime(txt(st, 'Time')) }));

/* ---------- local app: Excel, full copies, backup reminder, AI copy, install ---------- */
const APP_VERSION = '3.1';
const DATA_SHEET = 'Datos (no editar)';
function dataRows() {
  const rows = [['coleccion', 'id', 'datos']]; const CH = 30000;
  const push = (col, id, obj) => { const s = JSON.stringify(obj); const r = [col, id]; for (let i = 0; i < s.length; i += CH) r.push(s.slice(i, i + CH)); if (r.length === 2) r.push('{}'); rows.push(r); };
  const add = (col, m) => Array.from(m.values()).forEach(d => { const b = clone(d); delete b.id; push(col, d.id, b); });
  add('carreras', S.races); add('errores', S.errors); add('mapas', S.maps);
  const cfg = clone(S.config); delete cfg.id; push('config', 'app', cfg);
  return rows;
}
function markBackup() { saveConfig({ ultimaCopia: new Date().toISOString() }); }
function exportExcel() {
  const blob = XL.write([
    { name: 'Carreras', rows: carrerasRows(), widths: [11, 30, 10, 12, 14, 9, 9, 7, 6, 8, 9] },
    { name: 'Errores', rows: erroresRows(), widths: [11, 30, 10, 8, 9, 10, 16, 18, 8, 22, 22, 40, 40] },
    { name: DATA_SHEET, rows: dataRows(), widths: [10, 36, 80] }
  ]);
  saveFile('diario-orientacion-' + todayStr() + '.xlsx', blob);
  markBackup();
}
async function xlsxToData(file) {
  const book = await XL.read(file);
  const rows = book[DATA_SHEET]; if (!rows) throw new Error('nosheet');
  const data = { app: 'diario-orientacion', version: 1, carreras: [], errores: [], mapas: [], config: null };
  rows.slice(1).forEach(r => {
    const col = String(r[0] || ''), id = String(r[1] || ''); if (!col || !id) return;
    let body; try { body = JSON.parse(r.slice(2).map(v => String(v == null ? '' : v)).join('')); } catch (e) { return; }
    if (col === 'config') data.config = body;
    else if (Array.isArray(data[col])) data[col].push(Object.assign({ id }, body));
  });
  return data;
}
function blobToB64(b) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(b); }); }

  const box = $('#exp-full'); if (box) box.innerHTML = '<p class="small muted">Preparando la copia con los mapas…</p>';
  const strip = m => Array.from(m.values()).map(clone);
  const cfg = clone(S.config); delete cfg.id;
  const assets = []; const seen = new Set();
  const ids = []; S.maps.forEach(m => { if (m.assetId) ids.push(m.assetId); }); S.errors.forEach(e => (e.fotos || []).forEach(a => ids.push(a)));
  for (const a of ids) {
    if (seen.has(a)) continue; seen.add(a);
    try { const b = await window.__ODB.getBlob(a); if (b) assets.push({ id: a, type: b.type, b64: await blobToB64(b) }); } catch (e) { /* skip this image */ }
  }
  const data = { app: 'diario-orientacion', version: 1, exportado: new Date().toISOString(), carreras: strip(S.races), errores: strip(S.errors), mapas: strip(S.maps), config: cfg, assets };
  S.fullCopy = new Blob([JSON.stringify(data)], { type: 'application/json' });
  if (box) box.innerHTML = '<div class="confirm"><p>Copia lista: ' + S.races.size + ' carreras, ' + S.errors.size + ' errores y ' + assets.length + ' imágenes · ' + fmtBytes(S.fullCopy.size) + '.</p><div class="row-end"><button type="button" class="btn btn-primary btn-sm" data-act="exp-full-save">Guardar copia</button></div></div>';
}
function daysSince(iso) { const t = Date.parse(iso || ''); return isNaN(t) ? null : Math.floor((Date.now() - t) / 86400000); }

A['exp-xlsx'] = () => exportExcel();

    navigator.clipboard.writeText(text).then(() => { if (out) out.innerHTML = '<p class="small">Copiado. Abre Claude (o tu IA), pégalo y envía.</p>'; }, fallback);

/* ---------- boot ---------- */
async function useCap(name) { try { return (window.claude && typeof window.claude.use === 'function') ? await window.claude.use(name) : null; } catch (e) { return null; } }

  render();
  useCap('user').then(async u => { try { if (u && !(await u.canEdit())) showBanner('Estás viendo este diario en modo lectura: los cambios no se guardarán.'); } catch (e) { /* ignore */ } });

    S.cap.assets = r[0]; S.cap.downloads = r[1]; S.cap.sample = r[2]; S.capReady = true;
    if (!S.ready) return;
